services:
  postgres:
    image: postgres:16-alpine
    container_name: takeai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: takeai
      POSTGRES_PASSWORD: takeai_dev_password
      POSTGRES_DB: takeai
    ports:
      - "5432:5432"
    volumes:
      - takeai_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U takeai -d takeai"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  takeai_postgres_data:
